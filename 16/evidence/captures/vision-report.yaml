sc9_logo_recreation:
  visible: no
  what_you_saw: >-
    No reproduced, recreated, or hotlinked copy of the Brothertown Indian Nation
    two-tone-teal logo mark or the circular teal #0f8176 badge appears anywhere in
    any of the four captures — not in the header, hero/content, or footer. The
    header branding area shows only a text wordmark site title "Brothertown
    Language" (styled plain text in the theme heading color), followed by nav
    links Home/About/Blog, a half-circle dark/light mode toggle icon, and a
    search input with magnifier icon. The footer shows only an orange RSS icon,
    About/Sitemap links, the copyright line, and "Powered by Zola & Abridge". No
    image asset resembling the Nation's mark exists on these pages. (A browser-tab
    favicon would not be visible in these page-only captures regardless.)
overall_conclusion: >-
  All four captures render a fully styled page with no unstyled flash, missing
  background, or overlapping elements. The two dark-mode captures show the expected
  very-dark-charcoal ground with aqua-teal headings/brand and light-gray body text,
  and the two light-mode captures show white ground, charcoal headings, slate body,
  and dark blue-teal links; layout is identical across modes with no reflow. The
  only palette deviation worth noting is that the byline/taxonomy-tag link run
  renders pale gray/white in dark mode instead of the aqua #52b2a6 link color used
  by nav/footer links — readable, but inconsistent with the stated dark-mode link
  color. No copy of the Brothertown Indian Nation logo or badge appears anywhere;
  branding is text-only.
limitations: >-
  Static captures only: exact hex values are visual approximations (no pixel
  sampling performed); scroll regions below the fold on the post pages were not
  captured if the pages extend past 720px, so footer/link rendering on the post
  pages specifically is unverified; the browser tab/favicon area is outside these
  page-only screenshots, so favicon behavior cannot be assessed; link hover states
  (#6fd4c2 bright-aqua hover in dark mode) cannot be observed in static captures;
  the pale-vs-aqua tone of the byline/tag links in dark mode is an observation of
  rendered color class behavior whose underlying CSS rule I did not inspect.
provenance_note: >-
  Follow-up computed-color probe (main session, live browser): the byline author
  link and tag links compute to rgb(82, 178, 166) = #52b2a6 — exactly the mapped
  dark link role $a1d. The "pale gray" reading came from the near-white date text
  (#e1e7ec) inside the same byline run; the links themselves carry the mapped
  palette. Recorded in the implement work record 2026-10-27.
