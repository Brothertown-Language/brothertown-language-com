    note: "WordPress 6.x homepage, theme 'Pressville' v2.6.6 (LSVR), WooCommerce + Ultimate Member; full HTML obtained first fetch (no JS shell); untrusted-content rules followed"

logo:
  files:
    - url: "https://brothertownindians.org/wp-content/uploads/2022/05/BIN_logo_tagline800.png"
      local_path: "/tmp/opencode/bi-colors/BIN_logo_tagline800.png"
      format: "PNG 8-bit RGBA"
      dimensions: "800x200 px"
      note: "site header logo; used as '.header-titlebar__logo-image' inside a[href=/] (homepage HTML line ~500); custom-logo body class wp-custom-logo; max-width 600px in titlebar"
    - url: "https://brothertownindians.org/wp-content/uploads/2022/03/cropped-Tribe_Icon512-1-180x180.png"
      local_path: "/tmp/opencode/bi-colors/Tribe_Icon_favicon_180.png"
      format: "PNG 8-bit RGBA"
      dimensions: "180x180 px"
      note: "apple-touch-icon + site icon variants (32/180/192/270 sizes, all cropped-Tribe_Icon512-1-*); circular badge mark, likely 'Tribe' seal"
  colors_from: "pixels"
  dominant_colors:
    # header logo BIN_logo_tagline800.png — Pillow pixel analysis, clusters (24-step buckets),
    # rep = most-common exact color in cluster, share of opaque px (alpha>=64); transparent px excluded
    - {hex: "#006973", share_pct: 19.4, note: "dark blue-teal — wordmark/tagline fill (exact-count #006973 itself 17.65%)"}
    - {hex: "#007A6F", share_pct: 16.0, note: "dark green-teal, second fill shade (exact #00796E-#007D72 family)"}
    - {hex: "#52B2A6", share_pct: 21.4, note: "light aqua-green family; clusters #48A8A8 10.9% + #60C0A8 7.4% (#54B6AA) + #48C0A8 3.1% (#53B4A8) combined"}
    - {hex: "#000000", share_pct: 17.7, note: "near-black text/outline; clusters #000000 12.7% + #050D0C 2.5% + #373435 2.5% combined"}
    - {hex: "#FFFFFF", share_pct: 2.7, note: "white interior marks"}
    - {hex: "#00423C", share_pct: 3.1, note: "very deep teal shading (clusters #006060 + #004848 + #003030, #00675E rep)"}
  notes: >
    Header logo (BIN_logo_tagline800.png) is a two-tone-teal mark + tagline with black text:
    dark blue-teal #006973 and dark green-teal #007A6F (together ~35.4% of opaque pixels)
    plus a light aqua-green #52B2A6-family (~21.4%), black (#000000 near-black, ~17.7%),
    white (#FFFFFF 2.7%), deep-teal shading (#00423C ~3.1%). 3,791 distinct exact colors =
    JPEG-free source PNG with soft edges; clustering rounds to ~24-step buckets.
    Favicon (Tribe_Icon, 180x180, 50.4% opaque): dominant filled badge is dark teal
    #0F8176 (57.0%), with near-black outline #0A0A0A/#1B191A (~14.5%), white marks
    #FEFEFE/#FFFFFF (~6-7%), and deep-teal shading #1C625B/#1E504B (~2-3%).
    The favicon teal #0F8176 is a different (darker, greener) dark teal than the logo's
    #006973/#007A6F family — deliberate two-brand-teal situation worth flagging.

