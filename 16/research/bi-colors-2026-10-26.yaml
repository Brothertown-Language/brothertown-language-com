    - {hex: "#265e88", role: "dark blue: alert/contact-form (wpcf7) message text", selector: ".lsvr-alert-message, div.wpcf7-response-output", source: "skins/default.css"}
    - {hex: "#f6f5f5", role: "near-white: mobile topbar bg", selector: ".header-topbar (max-width:991px media, both inline and skin files)", source: "inline color-scheme block + skins/default.css"}
    - {hex: "#49525c", role: "slightly darker slate: footer form fields bg", selector: "footer .footer-widget select", source: "skins/default.css (2 occurrences)"}
    - {hex: "#32373c", role: "WordPress-core default button color (not brand-specific)", selector: ":root .wp-element-button, .wp-block-button__link", source: "wp core classic-theme-styles inline CSS on homepage"}
    - {hex: "#ffffff", role: "body/page background, text on dark surfaces", selector: "body{background-color:#FFF}", source: "skins/default.css; rgba tints rgba(45,147,197,x)=#2d93c5 and rgba(15,136,155,x)=#0f889b also used for hover fills" }
